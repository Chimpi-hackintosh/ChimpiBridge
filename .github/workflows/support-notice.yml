name: Check localized support notice
on:
  pull_request:
    paths: ['support_notice.py', 'tests/test_support_notice.py', '.github/workflows/support-notice.yml', '**/*.py']
permissions:
  contents: read
jobs:
  support-notice:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt runtime libraries
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
          CHIMPI_SUPPORT_CHECK: '0'
      - run: python -m compileall -q .
