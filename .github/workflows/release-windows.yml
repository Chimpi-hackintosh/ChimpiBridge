name: Build desktop packages for maintainer release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Numeric ID of the draft created by Chimpi-hackintosh
        required: true
        default: '427174137'
      finalize_only:
        description: Finalize an already built draft without rebuilding packages
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: chimpibridge-desktop-release
  cancel-in-progress: false

env:
  TARGET_RELEASE_ID: ${{ inputs.release_id }}

jobs:
  prepare:
    if: ${{ !inputs.finalize_only }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate the maintainer-owned draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_packages.py prepare

  windows:
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Run Windows tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Build ZIP and standalone EXE
        shell: pwsh
        run: |
          $tools = Join-Path $env:ANDROID_HOME 'platform-tools'
          python scripts/build_windows.py --portable-only --standalone --platform-tools "$tools"
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
      - name: Verify portable EXE
        run: python scripts/check_windows_bundle.py dist/ChimpiBridge/ChimpiBridge.exe
      - name: Verify standalone EXE and real ADB download
        run: python scripts/check_windows_bundle.py release/ChimpiBridge-0.1.1-windows-x64.exe --download-adb
      - name: Attach Windows packages to the maintainer's draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_packages.py upload

  macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Run macOS tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Build, sign locally, ZIP and reopen the macOS app
        run: python scripts/build_macos.py
      - name: Attach macOS packages to the maintainer's draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_packages.py upload

  finalize:
    needs: [windows, macos]
    if: ${{ always() && (inputs.finalize_only || (needs.windows.result == 'success' && needs.macos.result == 'success')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Prepare the tested release for publication by its owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_packages.py finalize
