name: Build and publish Windows portable

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chimpibridge-windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python x64
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Run tests on Windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build portable Windows package
        shell: pwsh
        run: |
          $tools = Join-Path $env:ANDROID_HOME 'platform-tools'
          if (-not (Test-Path (Join-Path $tools 'adb.exe'))) {
            throw 'The Windows runner does not provide Android Platform-Tools'
          }
          python scripts/build_windows.py --portable-only --platform-tools "$tools"
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }

      - name: Verify the frozen EXE starts
        run: python scripts/check_windows_bundle.py dist/ChimpiBridge/ChimpiBridge.exe

      - name: Publish the portable EXE package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from chimpibridge import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the application version' }
          $tag = "v$version"
          $archive = "release/ChimpiBridge-$version-windows-x64-portable.zip"
          if (-not (Test-Path $archive)) { throw 'The portable ZIP is missing' }
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content "$archive.sha256" -Encoding ascii
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --prerelease --title "ChimpiBridge $version - Windows x64" --notes-file .github/release-notes-windows.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the release' }
          }
          gh release upload $tag "$archive" "$archive.sha256" --clobber --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the Windows package' }
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" --json url,assets

